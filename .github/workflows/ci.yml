name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # PostGIS, not plain postgres — Rounds' migrations enable the postgis
    # extension (SPEC.md §5) and will fail to apply without it.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: service_projects_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/service_projects_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/service_projects_ci
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Runs `prisma generate` via packages/database's postinstall.
      - run: npm ci

      - run: npm run db:migrate:deploy

      # SPEC.md §11.1: "A CI check fails the build on a key with no
      # default." — this is that check.
      - run: npm run check:copy

      - run: npm run lint

      - run: npm run build
