name: Migrate deploy (manual)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma migrate status
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      # Baseline: these 7 migrations' schema is already live in production
      # (the database was never initialized via `migrate deploy`, so Prisma's
      # own bookkeeping table has no record of them) -- mark them applied
      # without re-running their SQL. continue-on-error because a prior run
      # may have already marked some of these (idempotent either way).
      - name: Baseline pre-existing migrations
        continue-on-error: true
        run: |
          for m in \
            20260805052351_init \
            20260805063000_five_role_migration_and_phase0_models \
            20260805063500_nextauth_adapter_tables \
            20260805071500_flag_subscription_model \
            20260805144002_drop_route_assignments \
            20260805153028_add_password_hash \
            20260805193313_add_onboarded_at; do
            npx prisma migrate resolve --applied "$m"
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      # A prior run found the *last two* migrations partially applied too
      # (e.g. `Household.userId` already existed) -- something added parts
      # of this schema outside of `migrate deploy` at some point. Rather
      # than guess further, this step checks each column/index/constraint
      # from those two migrations individually and creates only what's
      # actually missing, then marks both migrations resolved. Safe to
      # re-run: every statement is guarded by an existence check.
      - name: Heal partially-applied migrations, then mark them resolved
        run: |
          sudo apt-get update -y >/dev/null && sudo apt-get install -y postgresql-client >/dev/null
          psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -f scripts/heal-household-migrations.sql
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - name: Resolve the two healed migrations
        continue-on-error: true
        run: |
          npx prisma migrate resolve --applied 20260806035144_link_household_to_user
          npx prisma migrate resolve --applied 20260806042723_household_review_and_token_expiry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
