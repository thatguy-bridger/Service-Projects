name: UGRC API probe (read-only, manual, temporary)

# Diagnostic only -- verifies UGRC_API_KEY works and confirms the real
# response shapes for packages/geo/src/ugrc.ts's endpoints (geocode is
# already verified; reverseGeocode/autocomplete/addressPointsInPolygon
# are not). The key itself is never echoed -- only response bodies and
# status codes. Delete this workflow once the shapes are confirmed and
# the code is updated, same as db-inspect.yml earlier.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Docs page reachability (sanity check -- this sandbox got 403 on these)
        run: |
          echo "--- gis.utah.gov geocoding docs ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://gis.utah.gov/using-the-mapserv-utah-gov-api-to-geocode-address/" || true
          echo "--- api.mapserv.utah.gov docs ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://api.mapserv.utah.gov/docs/" || true

      - name: Verified geocode endpoint (known-good address)
        env:
          UGRC_API_KEY: ${{ secrets.UGRC_API_KEY }}
        run: |
          echo "--- geocode: Utah State Capitol ---"
          curl -s "https://api.mapserv.utah.gov/api/v1/geocode/350%20State%20St/84103?spatialReference=4326&apiKey=$UGRC_API_KEY" | head -c 3000
          echo ""

      - name: Candidate reverse-geocode shapes
        env:
          UGRC_API_KEY: ${{ secrets.UGRC_API_KEY }}
        run: |
          echo "--- candidate 1: /geocode/reverse/{x}/{y} ---"
          curl -s -o /tmp/r1.json -w "HTTP %{http_code}\n" "https://api.mapserv.utah.gov/api/v1/geocode/reverse/-111.8910/40.7608?spatialReference=4326&apiKey=$UGRC_API_KEY"
          head -c 2000 /tmp/r1.json; echo ""
          echo "--- candidate 2: query param lat/lng ---"
          curl -s -o /tmp/r2.json -w "HTTP %{http_code}\n" "https://api.mapserv.utah.gov/api/v1/geocode/reverse?x=-111.8910&y=40.7608&spatialReference=4326&apiKey=$UGRC_API_KEY"
          head -c 2000 /tmp/r2.json; echo ""

      - name: Candidate autocomplete shapes
        env:
          UGRC_API_KEY: ${{ secrets.UGRC_API_KEY }}
        run: |
          echo "--- candidate 1: /geocode/candidates/{text} ---"
          curl -s -o /tmp/a1.json -w "HTTP %{http_code}\n" "https://api.mapserv.utah.gov/api/v1/geocode/candidates/350%20State?spatialReference=4326&apiKey=$UGRC_API_KEY"
          head -c 2000 /tmp/a1.json; echo ""
          echo "--- candidate 2: /autocomplete/{text} ---"
          curl -s -o /tmp/a2.json -w "HTTP %{http_code}\n" "https://api.mapserv.utah.gov/api/v1/autocomplete/350%20State?apiKey=$UGRC_API_KEY"
          head -c 2000 /tmp/a2.json; echo ""

      - name: Candidate address-points-in-polygon (Open SGID) shapes
        env:
          UGRC_API_KEY: ${{ secrets.UGRC_API_KEY }}
        run: |
          echo "--- candidate 1: /geocode/addresspoints (small bbox around SLC) ---"
          curl -s -o /tmp/p1.json -w "HTTP %{http_code}\n" "https://api.mapserv.utah.gov/api/v1/geocode/addresspoints?bbox=-111.90,40.75,-111.88,40.77&spatialReference=4326&apiKey=$UGRC_API_KEY"
          head -c 2000 /tmp/p1.json; echo ""
          echo "--- candidate 2: SGID open data query endpoint ---"
          curl -s -o /tmp/p2.json -w "HTTP %{http_code}\n" "https://api.mapserv.utah.gov/api/v1/query?layer=SGID.LOCATION.AddressPoints&apiKey=$UGRC_API_KEY"
          head -c 2000 /tmp/p2.json; echo ""
