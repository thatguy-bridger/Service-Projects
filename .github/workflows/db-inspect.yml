name: DB inspect (read-only, manual)

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Read-only SQL to run (SELECT only)"
        required: true
        default: "SELECT id, \"orgId\", name, slug, \"deletedAt\" FROM \"Category\" ORDER BY \"createdAt\" DESC;"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update -y >/dev/null && sudo apt-get install -y postgresql-client >/dev/null
      - name: Run query
        run: psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -c "${{ inputs.query }}"
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
